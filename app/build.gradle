apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.example.rtspviewer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.rtspviewer"
        // minSdk 21 = Android 5.0 (Lollipop). Es el minimo que exige Media3
        // (la extension RTSP del ExoPlayer "clasico" nunca se publico en
        // Maven, por eso usamos Media3 en su lugar).
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // libVLC trae librerias nativas para 4 arquitecturas; nos
        // quedamos solo con las dos que cubren practicamente cualquier
        // telefono Android real (viejo o nuevo) para no inflar el APK.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // No usamos AppCompat/Material a proposito: mantiene el APK pequeño
    // y arranca mas rapido en hardware antiguo.
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'

    // libVLC: mismo motor que usa la app VLC de escritorio/movil. Mucho
    // mas tolerante con servidores RTSP "caseros" o no estandar que
    // Media3/ExoPlayer, que es mas estricto.
    implementation 'org.videolan.android:libvlc-all:3.6.3'
}
